name: XPU model, DSE, wavefront RTL and 3D

on:
  push:
  pull_request:

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          mkdir -p artifacts build
          sudo apt-get update
          sudo apt-get install -y iverilog libssl-dev

      - name: Run V1 quantitative model
        run: python3 calculations/xpu_v1_model.py | tee artifacts/xpu_v1_model_output.txt

      - name: Run V2 design-space search
        run: |
          python3 calculations/xpu_v2_dse.py \
            --csv artifacts/xpu_v2_dse_all.csv \
            --report artifacts/XPU_V2_DSE_RESULTS.md \
            | tee artifacts/xpu_v2_dse_console.txt
          cmp calculations/XPU_V2_DSE_RESULTS.md artifacts/XPU_V2_DSE_RESULTS.md

      - name: Run V2 NoC and route-event budgets
        run: |
          python3 calculations/xpu_v2_noc.py | tee artifacts/xpu_v2_noc.txt
          python3 calculations/xpu_v22_route_budget.py | tee artifacts/xpu_v22_route_budget.txt

      - name: Run V2.3 walker-elimination and wavefront capacity model
        run: |
          python3 calculations/xpu_v23_wavefront.py | tee artifacts/xpu_v23_wavefront.txt
          grep -q 'runtime dependency-control events = 0' artifacts/xpu_v23_wavefront.txt

      - name: Run locality-aware compiler placement benchmark
        run: |
          python3 compiler/place_graph.py \
            --out artifacts/PLACEMENT_RESULTS.json \
            --report artifacts/PLACEMENT_RESULTS.md \
            | tee artifacts/placement_console.txt
          cmp compiler/PLACEMENT_RESULTS.md artifacts/PLACEMENT_RESULTS.md

      - name: Run ready-node scheduler latency benchmark
        run: |
          python3 compiler/schedule_model.py \
            --out artifacts/SCHEDULER_RESULTS.json \
            --report artifacts/SCHEDULER_RESULTS.md \
            | tee artifacts/scheduler_console.txt
          cmp compiler/SCHEDULER_RESULTS.md artifacts/SCHEDULER_RESULTS.md

      - name: Run routed-token tile cycle model
        run: |
          python3 compiler/routed_tile_model.py | tee artifacts/routed_tile_console.txt
          cp compiler/ROUTED_TILE_RESULTS.json artifacts/
          cp compiler/ROUTED_TILE_RESULTS.md artifacts/

      - name: Run Decimal EML Q16 reference self-test
        run: python3 software/reference/eml_q16.py

      - name: Generate FPGA EML lookup tables
        run: python3 tools/gen_eml_lut.py

      - name: Verify LUT/interpolation against Decimal EML
        run: python3 software/reference/eml_lut_model.py --samples 50000 | tee artifacts/eml_lut_accuracy.txt

      - name: Pack, validate and execute XPU semantic graph
        run: |
          python3 software/reference/xpu_graph.py --out artifacts/demo_graph.xpu \
            | tee artifacts/xpu_graph_conformance.txt
          test -s artifacts/demo_graph.xpu
          grep -q 'XPU_V2_GRAPH_PASS' artifacts/xpu_graph_conformance.txt

      - name: Lower XPU to XPUR and execute routed image
        run: |
          python3 software/reference/xpur_image.py \
            --xpu-out artifacts/demo_from_xpur.xpu \
            --xpur-out artifacts/demo_graph.xpur \
            | tee artifacts/xpur_conformance.txt
          test -s artifacts/demo_graph.xpur
          grep -q 'XPU_V22_XPUR_PASS' artifacts/xpur_conformance.txt
          cmp artifacts/demo_graph.xpu artifacts/demo_from_xpur.xpu

      - name: Lower XPU to XPUW and execute walker-free wavefront image
        run: |
          python3 software/reference/xpuw_image.py --out artifacts/demo_graph.xpuw \
            | tee artifacts/xpuw_conformance.txt
          test -s artifacts/demo_graph.xpuw
          grep -q 'XPU_V23_WAVEFRONT_PASS' artifacts/xpuw_conformance.txt
          grep -q 'outputs=(57577, 157774)' artifacts/xpuw_conformance.txt

      - name: Run bounded XPU Device ABI host model
        run: |
          python3 software/reference/xpu_device_model.py \
            | tee artifacts/xpu_device_model.txt
          grep -q 'XPU_V22_DEVICE_MODEL_PASS' artifacts/xpu_device_model.txt

      - name: Compile independent C XPU executor
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            software/reference/xpu_graph_c.c -lcrypto -o build/xpu_graph_c
          build/xpu_graph_c artifacts/demo_graph.xpu \
            hardware/rtl/generated/exp_q16.memh \
            hardware/rtl/generated/ln_q16.memh \
            16384 98304 | tee artifacts/xpu_graph_c.txt
          grep -q 'XPU_V2_GRAPH_C_PASS.*outputs=57577,157774' artifacts/xpu_graph_c.txt

      - name: Compile and run EML lane RTL testbench
        run: |
          iverilog -g2012 -Wall \
            -o build/eml_lane_tb \
            hardware/rtl/eml_lane_lut.sv \
            hardware/rtl/tb_eml_lane_lut.sv
          vvp build/eml_lane_tb | tee artifacts/eml_lane_rtl.txt
          grep -q 'XPU_V2_EML_LANE_RTL_PASS' artifacts/eml_lane_rtl.txt

      - name: Compile replicated EML tile
        run: |
          iverilog -g2012 -Wall -s eml_tile \
            -o build/eml_tile_compile \
            hardware/rtl/eml_lane_lut.sv \
            hardware/rtl/eml_tile.sv

      - name: Compile and run V2.1 scalar-dependency tile
        run: |
          iverilog -g2012 -Wall -s tb_xpu_tile_core \
            -o build/xpu_v21_tile_tb \
            hardware/rtl/eml_lane_lut.sv \
            hardware/rtl/eml_tile.sv \
            hardware/rtl/xpu_graph_store.sv \
            hardware/rtl/xpu_value_store.sv \
            hardware/rtl/xpu_completion_bitmap.sv \
            hardware/rtl/xpu_dependency_engine.sv \
            hardware/rtl/xpu_ready_scheduler.sv \
            hardware/rtl/xpu_tile_core.sv \
            hardware/rtl/tb_xpu_tile_core.sv
          vvp build/xpu_v21_tile_tb | tee artifacts/xpu_v21_tile_rtl.txt
          grep -q 'XPU_V21_TILE_PASS' artifacts/xpu_v21_tile_rtl.txt

      - name: Compile and run V2.2 routed-token tile
        run: |
          iverilog -g2012 -Wall -s tb_xpu_routed_tile_v22 \
            -o build/xpu_v22_routed_tb \
            hardware/rtl/eml_lane_lut.sv \
            hardware/rtl/eml_tile.sv \
            hardware/rtl/xpu_graph_store.sv \
            hardware/rtl/xpu_ready_scheduler.sv \
            hardware/rtl/xpu_operand_store.sv \
            hardware/rtl/xpu_result_store.sv \
            hardware/rtl/xpu_route_table2.sv \
            hardware/rtl/xpu_route_emit2.sv \
            hardware/rtl/xpu_routed_tile_v22.sv \
            hardware/rtl/tb_xpu_routed_tile_v22.sv
          vvp build/xpu_v22_routed_tb | tee artifacts/xpu_v22_routed_rtl.txt
          grep -q 'XPU_V22_ROUTED_TILE_PASS' artifacts/xpu_v22_routed_rtl.txt

      - name: Compile V2.3 static multicast plane
        run: |
          iverilog -g2012 -Wall -s xpu_static_multicast_plane_v23 \
            -o build/xpu_v23_multicast_compile \
            hardware/rtl/xpu_static_multicast_plane_v23.sv

      - name: Compile and run V2.3 walker-free wavefront tile
        run: |
          iverilog -g2012 -Wall -s tb_xpu_wavefront_tile_v23 \
            -o build/xpu_v23_wavefront_tb \
            hardware/rtl/eml_lane_lut.sv \
            hardware/rtl/eml_tile.sv \
            hardware/rtl/xpu_wavefront_schedule_v23.sv \
            hardware/rtl/xpu_wavefront_ingress_v23.sv \
            hardware/rtl/xpu_wavefront_tile_v23.sv \
            hardware/rtl/tb_xpu_wavefront_tile_v23.sv
          vvp build/xpu_v23_wavefront_tb | tee artifacts/xpu_v23_wavefront_rtl.txt
          grep -q 'XPU_V23_WAVEFRONT_TILE_PASS' artifacts/xpu_v23_wavefront_rtl.txt

      - name: Export V1 ASCII STL
        run: |
          python3 hardware/3d/export_stl.py
          test -s hardware/3d/xpu_package.stl
          head -n 1 hardware/3d/xpu_package.stl | grep -q '^solid shtenco_xpu_v1'

      - name: Export V2 ASCII STL
        run: |
          python3 hardware/3d/export_v2_stl.py
          test -s hardware/3d/xpu_v2_package.stl
          head -n 1 hardware/3d/xpu_v2_package.stl | grep -q '^solid shtenco_xpu_v2'

      - name: Upload XPU engineering artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xpu-v23-engineering-artifacts
          path: |
            artifacts/
            hardware/rtl/generated/*.memh
            hardware/3d/xpu_package.stl
            hardware/3d/xpu_package.scad
            hardware/3d/xpu_v2_package.stl
            hardware/3d/xpu_v2_package.scad
